<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/wa-mobile-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WA Mobile">
  <link rel="stylesheet" href="style.css">
  <title>With Authority! Mobile</title>
</head>
<body>
  <main id="app">
    <section style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
      <div><h1 style="margin:0 0 12px">WITH AUTHORITY!</h1><p id="startup-status">Loading v0.9.124…</p></div>
    </section>
  </main>
  <script>
    window.__WA_BOOT_STARTED__ = Date.now();
    window.addEventListener('error', function (event) {
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<section style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box"><div><h1>STARTUP ERROR</h1><p>The game could not start.</p><p style="opacity:.8">' + String(event.message || 'Unknown error').replace(/[&<>\"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]}) + '</p><button onclick="location.reload()" style="padding:12px 20px;font-weight:bold">RELOAD</button></div></section>';
    });
    window.setTimeout(function () {
      var status = document.getElementById('startup-status');
      if (!status) return;
      status.textContent = 'Startup is taking too long. Reload the page or remove and re-add the Home Screen app.';
    }, 12000);
  </script>
  <script src="app.js?v=0.9.124"></script>
</body>
</html>
